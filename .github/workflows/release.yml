name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v0.1.0)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.15.2

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Executable binaries ──
          - name: macOS (arm64)
            runner: macos-14
            build: ""
            artifact: softether-zig-macos-arm64
            archive: tar.gz

          - name: Linux (x86_64)
            runner: ubuntu-latest
            build: ""
            artifact: softether-zig-linux-x86_64
            archive: tar.gz

          - name: Windows (x64)
            runner: windows-latest
            build: ""
            artifact: softether-zig-windows-x64
            archive: zip
            windows: true

          # ── Library only ──
          - name: macOS lib (arm64)
            runner: macos-14
            build: shared-lib
            artifact: libsoftether-zig-macos-arm64
            archive: tar.gz

          - name: Linux lib (x86_64)
            runner: ubuntu-latest
            build: shared-lib
            artifact: libsoftether-zig-linux-x86_64
            archive: tar.gz

          - name: Windows lib (x64)
            runner: windows-latest
            build: shared-lib
            artifact: libsoftether-zig-windows-x64
            archive: zip
            windows: true

          - name: iOS lib (arm64 device)
            runner: macos-14
            build: static-lib -Dtarget=aarch64-ios
            artifact: libsoftether-zig-ios-arm64
            archive: tar.gz

          - name: Android lib (arm64-v8a)
            runner: ubuntu-latest
            build: static-lib -Dtarget=aarch64-linux-android
            artifact: libsoftether-zig-android-arm64-v8a
            archive: tar.gz
            ndk: true

          - name: Android lib (armeabi-v7a)
            runner: ubuntu-latest
            build: static-lib -Dtarget=arm-linux-androideabi
            artifact: libsoftether-zig-android-armeabi-v7a
            archive: tar.gz
            ndk: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux' && !matrix.ndk
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Cache vcpkg packages (Windows)
        if: matrix.windows
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-openssl-${{ runner.os }}-x64-v2
          restore-keys: |
            vcpkg-openssl-${{ runner.os }}-x64-

      - name: Install OpenSSL (Windows via vcpkg)
        if: matrix.windows
        shell: pwsh
        run: |
          $opensslDir = "C:\vcpkg\installed\x64-windows"
          if (-not (Test-Path "$opensslDir\lib\libssl.lib")) {
            Write-Host "Cache miss; installing OpenSSL via vcpkg..."
            vcpkg install openssl:x64-windows
          } else {
            Write-Host "Using cached OpenSSL"
          }
          if (-not (Test-Path "$opensslDir\lib\libssl.lib")) {
            Write-Error "libssl.lib not found after vcpkg install"
            Get-ChildItem "$opensslDir" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 50
            exit 1
          }
          echo "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
          Write-Host "OpenSSL ready at $opensslDir"

      - name: Setup Android NDK
        if: matrix.ndk
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: false

      - name: Export NDK env
        if: matrix.ndk
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Build
        if: "!matrix.windows"
        shell: bash
        run: |
          if [ -z "${{ matrix.build }}" ]; then
            zig build --release=fast --summary all
          else
            zig build ${{ matrix.build }} --release=fast --summary all
          fi

      - name: Build (Windows)
        if: matrix.windows
        shell: pwsh
        run: |
          $buildTarget = "${{ matrix.build }}"
          if ([string]::IsNullOrEmpty($buildTarget)) {
            zig build --release=fast --summary all
          } else {
            zig build $buildTarget --release=fast --summary all
          }

      - name: List build outputs
        shell: bash
        run: ls -lhR zig-out/

      - name: Stage release files
        shell: bash
        run: |
          set -eu
          STAGE="staging/${{ matrix.artifact }}"
          mkdir -p "$STAGE"
          cp -r zig-out/. "$STAGE/"
          if [ -d include ]; then
            mkdir -p "$STAGE/include"
            cp -r include/. "$STAGE/include/"
          fi
          echo "${{ steps.version.outputs.tag }}" > "$STAGE/VERSION"
          echo "${{ github.sha }}" > "$STAGE/COMMIT"
          ls -lhR "$STAGE"

      - name: Create archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -eu
          cd staging
          tar -czf "${{ matrix.artifact }}-${{ steps.version.outputs.tag }}.tar.gz" "${{ matrix.artifact }}"
          ls -lh "${{ matrix.artifact }}-${{ steps.version.outputs.tag }}.tar.gz"

      - name: Create archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Set-Location staging
          Compress-Archive -Path "${{ matrix.artifact }}" -DestinationPath "${{ matrix.artifact }}-${{ steps.version.outputs.tag }}.zip" -Force
          Get-Item "${{ matrix.artifact }}-${{ steps.version.outputs.tag }}.zip" | Format-List Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staging/${{ matrix.artifact }}-${{ steps.version.outputs.tag }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets and generate checksums
        run: |
          set -eu
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          echo "Release assets:"
          ls -lh
          echo ""
          echo "Checksums:"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-rc') || contains(steps.version.outputs.tag, '-beta') || contains(steps.version.outputs.tag, '-alpha') }}

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        run: |
          cd /tmp
          curl -LO https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz
          tar -xf zig-aarch64-macos-0.15.2.tar.xz
          sudo mv zig-aarch64-macos-0.15.2 /usr/local/zig
          echo "/usr/local/zig" >> $GITHUB_PATH

      - name: Install dependencies
        run: brew install openssl@3

      - name: Build shared library
        run: zig build shared-lib -Doptimize=ReleaseFast

      - uses: actions/upload-artifact@v4
        with:
          name: macos-lib
          path: zig-out/lib/

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        run: |
          cd /tmp
          wget https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar -xf zig-x86_64-linux-0.15.2.tar.xz
          sudo mv zig-x86_64-linux-0.15.2 /usr/local/zig
          echo "/usr/local/zig" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Build shared library
        run: zig build shared-lib -Doptimize=ReleaseFast

      - uses: actions/upload-artifact@v4
        with:
          name: linux-lib
          path: zig-out/lib/

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        shell: pwsh
        run: |
          curl -LO https://ziglang.org/download/0.15.2/zig-x86_64-windows-0.15.2.zip
          Expand-Archive zig-x86_64-windows-0.15.2.zip -DestinationPath C:\
          echo "C:\zig-x86_64-windows-0.15.2" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache vcpkg packages
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
            C:\vcpkg\packages
          key: vcpkg-openssl-x64-windows-${{ runner.os }}

      - name: Install dependencies
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: vcpkg install openssl:x64-windows

      - name: Set OPENSSL_DIR
        run: echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build shared library
        run: zig build shared-lib -Doptimize=ReleaseFast

      - uses: actions/upload-artifact@v4
        with:
          name: windows-lib
          path: zig-out/lib/

  build-ios:
    name: Build iOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        run: |
          cd /tmp
          curl -LO https://ziglang.org/download/0.15.2/zig-aarch64-macos-0.15.2.tar.xz
          tar -xf zig-aarch64-macos-0.15.2.tar.xz
          sudo mv zig-aarch64-macos-0.15.2 /usr/local/zig
          echo "/usr/local/zig" >> $GITHUB_PATH

      - name: Build static library (arm64)
        run: zig build static-lib -Dtarget=aarch64-ios -Doptimize=ReleaseFast

      - uses: actions/upload-artifact@v4
        with:
          name: ios-lib
          path: zig-out/lib/

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        run: |
          cd /tmp
          wget https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar -xf zig-x86_64-linux-0.15.2.tar.xz
          sudo mv zig-x86_64-linux-0.15.2 /usr/local/zig
          echo "/usr/local/zig" >> $GITHUB_PATH

      - name: Build static library (arm64)
        run: zig build static-lib -Dtarget=aarch64-linux-android -Doptimize=ReleaseFast

      - name: Build static library (armv7)
        run: zig build static-lib -Dtarget=arm-linux-android -Doptimize=ReleaseFast

      - uses: actions/upload-artifact@v4
        with:
          name: android-lib
          path: zig-out/lib/

  create-release:
    name: Create GitHub Release
    needs:
      - build-macos
      - build-linux
      - build-windows
      - build-ios
      - build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

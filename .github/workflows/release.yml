name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v0.1.0)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.15.2

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Executable binaries ──
          - name: macOS (arm64)
            runner: macos-15
            build: ""
            artifact: softether-zig-macos-arm64
            archive: tar.gz

          - name: macOS (x86_64)
            runner: macos-15-intel
            build: ""
            artifact: softether-zig-macos-x86_64
            archive: tar.gz

          - name: Linux (x86_64)
            runner: ubuntu-latest
            build: ""
            artifact: softether-zig-linux-x86_64
            archive: tar.gz

          - name: Linux (arm64)
            runner: ubuntu-24.04-arm
            build: ""
            artifact: softether-zig-linux-arm64
            archive: tar.gz

          - name: Windows (x64)
            runner: windows-latest
            build: ""
            artifact: softether-zig-windows-x64
            archive: zip
            windows: true
            os_arch: x64

          - name: Windows (arm64)
            runner: windows-11-arm
            build: ""
            artifact: softether-zig-windows-arm64
            archive: zip
            windows: true
            os_arch: arm64

          # ── Library only ──
          - name: macOS lib (arm64)
            runner: macos-15
            build: shared-lib
            artifact: libsoftether-zig-macos-arm64
            archive: tar.gz

          - name: macOS lib (x86_64)
            runner: macos-15-intel
            build: shared-lib
            artifact: libsoftether-zig-macos-x86_64
            archive: tar.gz

          - name: Linux lib (x86_64)
            runner: ubuntu-latest
            build: shared-lib
            artifact: libsoftether-zig-linux-x86_64
            archive: tar.gz

          - name: Linux lib (arm64)
            runner: ubuntu-24.04-arm
            build: shared-lib
            artifact: libsoftether-zig-linux-arm64
            archive: tar.gz

          - name: Windows lib (x64)
            runner: windows-latest
            build: shared-lib
            artifact: libsoftether-zig-windows-x64
            archive: zip
            windows: true
            os_arch: x64

          - name: Windows lib (arm64)
            runner: windows-11-arm
            build: shared-lib
            artifact: libsoftether-zig-windows-arm64
            archive: zip
            windows: true
            os_arch: arm64

          - name: iOS lib (arm64 device)
            runner: macos-15
            build: static-lib -Dtarget=aarch64-ios
            artifact: libsoftether-zig-ios-arm64
            archive: tar.gz

          - name: Android lib (arm64-v8a)
            runner: ubuntu-latest
            build: static-lib -Dtarget=aarch64-linux-android
            artifact: libsoftether-zig-android-arm64-v8a
            archive: tar.gz
            ndk: true

          - name: Android lib (armeabi-v7a)
            runner: ubuntu-latest
            build: static-lib -Dtarget=arm-linux-androideabi
            artifact: libsoftether-zig-android-armeabi-v7a
            archive: tar.gz
            ndk: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Verify build.zig.zon version matches tag
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Strip 'v' prefix: v0.1.7 → 0.1.7
          TAG_VERSION="${TAG#v}"
          # Extract .version from build.zig.zon
          ZON_VERSION=$(grep -o '\.version\s*=\s*"[^"]*"' build.zig.zon | grep -o '"[^"]*"' | tr -d '"')
          if [ "$TAG_VERSION" != "$ZON_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "   Git tag:             $TAG → $TAG_VERSION"
            echo "   build.zig.zon:       $ZON_VERSION"
            echo ""
            echo "   Bump .version in build.zig.zon to $TAG_VERSION before tagging."
            echo "   Example:  sed -i '' 's/\\.version = \"[^\"]*\"/.version = \"$TAG_VERSION\"/' build.zig.zon"
            exit 1
          fi
          echo "✅ Tag $TAG matches build.zig.zon version $ZON_VERSION"

      - name: Cache Zig compiler
        uses: actions/cache@v4
        with:
          path: ~/.cache/setup-zig
          key: zig-${{ env.ZIG_VERSION }}-${{ runner.os }}

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache: true

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux' && !matrix.ndk
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Cache vcpkg packages (Windows)
        if: matrix.windows
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-openssl-${{ runner.os }}-${{ matrix.os_arch }}-v3
          restore-keys: |
            vcpkg-openssl-${{ runner.os }}-${{ matrix.os_arch }}-

      - name: Install OpenSSL (Windows via vcpkg — choco only ships x64)
        if: matrix.windows
        shell: pwsh
        run: |
          $osArch = "${{ matrix.os_arch }}"
          $triplet = "$($osArch)-windows"
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          $vcpkgExe = Join-Path $vcpkgRoot "vcpkg.exe"
          $opensslDir = Join-Path $vcpkgRoot "installed\$triplet"
          if (-not (Test-Path "$opensslDir\lib\libssl.lib")) {
            Write-Host "Cache miss; installing OpenSSL via vcpkg ($triplet)..."
            & $vcpkgExe install "openssl:$triplet" --triplet $triplet
            if ($LASTEXITCODE -ne 0) {
              Write-Error "vcpkg openssl:$triplet install failed"
              exit 1
            }
          } else {
            Write-Host "Using cached OpenSSL"
          }
          if (-not (Test-Path "$opensslDir\lib\libssl.lib")) {
            Write-Error "libssl.lib not found after vcpkg install"
            Get-ChildItem "$opensslDir" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 50
            exit 1
          }
          echo "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
          Write-Host "OpenSSL ready at $opensslDir"

      - name: Setup Android NDK
        if: matrix.ndk
        run: |
          NDK_VERSION="27.0.11902837"
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -d "$NDK_DIR" ]; then
            echo "NDK $NDK_VERSION not found, installing..."
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;$NDK_VERSION"
          else
            echo "NDK $NDK_VERSION already installed"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV

      - name: Show toolchain versions
        run: zig version

      - name: Run tests
        run: zig build test --release=fast --summary all

      - name: Build
        if: "!matrix.windows"
        shell: bash
        run: |
          if [ -z "${{ matrix.build }}" ]; then
            zig build --release=fast --summary all
          else
            zig build ${{ matrix.build }} --release=fast --summary all
          fi

      - name: Build (Windows)
        if: matrix.windows
        shell: pwsh
        run: |
          $buildTarget = "${{ matrix.build }}"
          if ([string]::IsNullOrEmpty($buildTarget)) {
            zig build --release=fast --summary all
          } else {
            zig build $buildTarget --release=fast --summary all
          }

      - name: List build outputs
        shell: bash
        run: ls -lhR zig-out/

      - name: Stage release files
        shell: bash
        run: |
          set -eu
          STAGE="staging/${{ matrix.artifact }}"
          mkdir -p "$STAGE"
          cp -r zig-out/. "$STAGE/"
          if [ -d include ]; then
            mkdir -p "$STAGE/include"
            cp -r include/. "$STAGE/include/"
          fi
          echo "${{ steps.version.outputs.tag }}" > "$STAGE/VERSION"
          echo "${{ github.sha }}" > "$STAGE/COMMIT"
          ls -lhR "$STAGE"

      - name: Create archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -eu
          cd staging
          tar -czf "${{ matrix.artifact }}-${{ steps.version.outputs.tag }}.tar.gz" "${{ matrix.artifact }}"
          ls -lh "${{ matrix.artifact }}-${{ steps.version.outputs.tag }}.tar.gz"

      - name: Create archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Set-Location staging
          Compress-Archive -Path "${{ matrix.artifact }}" -DestinationPath "${{ matrix.artifact }}-${{ steps.version.outputs.tag }}.zip" -Force
          Get-Item "${{ matrix.artifact }}-${{ steps.version.outputs.tag }}.zip" | Format-List Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staging/${{ matrix.artifact }}-${{ steps.version.outputs.tag }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets and generate checksums
        run: |
          set -eu
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          echo "Release assets:"
          ls -lh
          echo ""
          echo "Checksums:"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-rc') || contains(steps.version.outputs.tag, '-beta') || contains(steps.version.outputs.tag, '-alpha') }}

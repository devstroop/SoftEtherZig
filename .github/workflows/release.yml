name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-14
            build: shared-lib
            deps: brew install openssl@3
            artifact: macos-lib
            lib_glob: "*.dylib"

          - name: Linux
            runner: ubuntu-latest
            build: shared-lib
            deps: sudo apt-get update && sudo apt-get install -y libssl-dev
            artifact: linux-lib
            lib_glob: "*.so"

          - name: Windows
            runner: windows-latest
            build: shared-lib
            deps: choco install openssl -y --no-progress
            artifact: windows-lib
            lib_glob: "*.dll"
            windows: true

          - name: iOS
            runner: macos-14
            build: static-lib -Dtarget=aarch64-ios
            artifact: ios-lib
            lib_glob: "*.a"

          - name: Android
            runner: ubuntu-latest
            build: static-lib -Dtarget=aarch64-linux-android
            artifact: android-lib
            lib_glob: "*.a"
            ndk: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install dependencies
        if: matrix.deps
        run: ${{ matrix.deps }}

      - name: Set OPENSSL_DIR
        if: matrix.windows
        shell: pwsh
        run: echo "OPENSSL_DIR=C:\OpenSSL-Win64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Android NDK
        if: matrix.ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Build
        run: zig build ${{ matrix.build }} --release=fast

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: zig-out/lib/${{ matrix.lib_glob }}

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [ '**' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: 0.15.2

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (aarch64)
            runner: macos-15
            build: shared-lib
            test: true

          - name: macOS (x86_64)
            runner: macos-15-intel
            build: shared-lib
            test: true

          - name: Linux (x86_64)
            runner: ubuntu-latest
            build: shared-lib
            test: true

          - name: Linux (arm64)
            runner: ubuntu-24.04-arm
            build: shared-lib
            test: true

          - name: Windows (x64)
            runner: windows-latest
            build: shared-lib
            cli: true
            test: true
            windows: true
            os_arch: x64

          - name: Windows (arm64)
            runner: windows-11-arm
            build: shared-lib
            cli: true
            test: true
            windows: true
            os_arch: arm64

          - name: iOS (arm64)
            runner: macos-15
            build: static-lib -Dtarget=aarch64-ios

          - name: Android (arm64-v8a)
            runner: ubuntu-latest
            build: static-lib -Dtarget=aarch64-linux-android
            ndk: true

          - name: Android (armeabi-v7a)
            runner: ubuntu-latest
            build: static-lib -Dtarget=arm-linux-androideabi
            ndk: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: devstroop/setup-zig@v1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: true

      - name: Setup OpenSSL 3
        if: runner.os != 'Linux' || !matrix.ndk
        uses: devstroop/setup-openssl@v1
        with:
          version: '3'

      - name: Setup Android NDK
        if: matrix.ndk
        uses: devstroop/setup-ndk@v1
        with:
          version: "27.0.11902837"
          cache-key: ${{ matrix.name }}

      - name: Show toolchain versions
        run: zig version

      - name: Build CLI (vpnclient)
        if: matrix.cli
        run: zig build --release=fast --summary all

      - name: Build (${{ matrix.build }})
        run: zig build ${{ matrix.build }} --release=fast --summary all

      - name: List build outputs
        shell: bash
        run: ls -lhR zig-out/

      - name: Run tests
        if: matrix.test
        run: zig build test --release=fast --summary all

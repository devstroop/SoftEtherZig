name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [ '**' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: 0.15.2

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            runner: macos-15
            build: shared-lib
            test: true

          - name: macOS (x86_64)
            runner: macos-15-intel
            build: shared-lib
            test: true

          - name: Linux (x86_64)
            runner: ubuntu-latest
            build: shared-lib
            test: true

          - name: Windows (x64)
            runner: windows-latest
            build: shared-lib
            test: true
            windows: true

          - name: iOS (arm64)
            runner: macos-15
            build: static-lib -Dtarget=aarch64-ios

          - name: Android (arm64-v8a)
            runner: ubuntu-latest
            build: static-lib -Dtarget=aarch64-linux-android
            ndk: true

          - name: Android (x86_64)
            runner: ubuntu-latest
            build: static-lib -Dtarget=x86_64-linux-android
            ndk: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Zig compiler
        uses: actions/cache@v4
        with:
          path: ~/.cache/setup-zig
          key: zig-${{ env.ZIG_VERSION }}-${{ runner.os }}

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache: true

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux' && !matrix.ndk
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Cache vcpkg packages (Windows)
        if: matrix.windows
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-openssl-${{ runner.os }}-x64-v3
          restore-keys: |
            vcpkg-openssl-${{ runner.os }}-x64-

      - name: Install OpenSSL (Windows via vcpkg)
        if: matrix.windows
        shell: pwsh
        run: |
          $opensslDir = "C:\vcpkg\installed\x64-windows"
          if (-not (Test-Path "$opensslDir\lib\libssl.lib")) {
            Write-Host "Cache miss; installing OpenSSL via vcpkg..."
            vcpkg install openssl:x64-windows
          } else {
            Write-Host "Using cached OpenSSL"
          }
          if (-not (Test-Path "$opensslDir\lib\libssl.lib")) {
            Write-Error "libssl.lib not found after vcpkg install"
            Get-ChildItem "$opensslDir" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 50
            exit 1
          }
          echo "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
          Write-Host "OpenSSL ready at $opensslDir"

      - name: Setup Android NDK
        if: matrix.ndk
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;27.0.11902837'

      - name: Export NDK env
        if: matrix.ndk
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.11902837" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.11902837" >> $GITHUB_ENV

      - name: Show toolchain versions
        run: zig version

      - name: Build (${{ matrix.build }})
        run: zig build ${{ matrix.build }} --release=fast --summary all

      - name: List build outputs
        shell: bash
        run: ls -lhR zig-out/

      - name: Run tests
        if: matrix.test
        run: zig build test --release=fast --summary all

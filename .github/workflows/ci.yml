name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [ '**' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: 0.15.2

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (aarch64)
            runner: macos-15
            build: shared-lib
            test: true

          - name: macOS (x86_64)
            runner: macos-15-intel
            build: shared-lib
            test: true

          - name: Linux (x86_64)
            runner: ubuntu-latest
            build: shared-lib
            test: true

          - name: Linux (arm64)
            runner: ubuntu-24.04-arm
            build: shared-lib
            test: true

          - name: Windows (x64)
            runner: windows-latest
            build: shared-lib
            cli: true
            test: true
            windows: true
            os_arch: x64

          - name: Windows (arm64)
            runner: windows-11-arm
            build: shared-lib
            cli: true
            test: true
            windows: true
            os_arch: arm64

          - name: iOS (arm64)
            runner: macos-15
            build: static-lib -Dtarget=aarch64-ios

          - name: Android (arm64-v8a)
            runner: ubuntu-latest
            build: static-lib -Dtarget=aarch64-linux-android
            ndk: true

          - name: Android (armeabi-v7a)
            runner: ubuntu-latest
            build: static-lib -Dtarget=arm-linux-androideabi
            ndk: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: devstroop/setup-zig@v1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: true

      - name: Setup OpenSSL 3
        if: runner.os != 'Linux' || !matrix.ndk
        uses: devstroop/setup-openssl@v1
        with:
          version: '3'

      - name: Setup Android NDK
        if: matrix.ndk
        uses: devstroop/setup-ndk@v1
        with:
          version: '27.0.11902837'
          use-cache: true

      - name: Show toolchain versions
        run: zig version

      - name: Build CLI (vpnclient)
        if: matrix.cli
        run: zig build --release=fast --summary all

      - name: Build (${{ matrix.build }})
        run: zig build ${{ matrix.build }} --release=fast --summary all

      - name: List build outputs
        shell: bash
        run: ls -lhR zig-out/

      - name: Run tests (standalone)
        if: matrix.test
        timeout-minutes: 5
        run: zig build test-standalone --release=fast --summary all

      - name: Run tests (FFI)
        if: matrix.test
        timeout-minutes: 5
        run: zig build test-ffi --release=fast --summary all

      - name: Run tests (whole package)
        if: matrix.test
        timeout-minutes: 10
        run: zig build test-all --release=fast --summary all

      - name: Run tests (vpnserver)
        if: matrix.test
        timeout-minutes: 5
        run: zig build test-server-exe --release=fast --summary all

      - name: Run tests (integration)
        if: matrix.test
        timeout-minutes: 5
        run: zig build test-integration --release=fast --summary all

      - name: Run tests (DHCPv6)
        if: matrix.test
        timeout-minutes: 5
        run: zig build test-dhcpv6 --release=fast --summary all

      # Bridge BPF live smoke (issue #60): install the SUID helper from the
      # shared-lib build output (built above) and re-run the test suite so
      # the bpf.zig live tests exercise a real /dev/bpfN attach on lo0.
      # GitHub macOS runners provide passwordless sudo. On the plain test
      # run above the live tests skip cleanly (no privileged path); with the
      # helper in place they assert real BPF round-trips.
      - name: Bridge BPF live smoke (macOS, setuid helper)
        if: runner.os == 'macOS' && matrix.test
        timeout-minutes: 10
        run: |
          sudo mkdir -p /usr/local/libexec
          sudo cp zig-out/bin/softether-utun-helper /usr/local/libexec/softether-utun-helper
          sudo chown root:wheel /usr/local/libexec/softether-utun-helper
          sudo chmod 4755 /usr/local/libexec/softether-utun-helper
          zig build test-all --release=fast --summary all

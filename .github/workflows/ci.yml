name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-14
            build: shared-lib
            test: test
            deps: brew install openssl@3

          - name: Linux
            runner: ubuntu-latest
            build: shared-lib
            test: test
            deps: sudo apt-get update && sudo apt-get install -y libssl-dev

          - name: Windows
            runner: windows-latest
            build: shared-lib
            test: test
            deps: choco install openssl -y --no-progress
            windows: true

          - name: iOS
            runner: macos-14
            build: static-lib -Dtarget=aarch64-ios

          - name: Android
            runner: ubuntu-latest
            build: static-lib -Dtarget=aarch64-linux-android
            ndk: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Show Zig version
        run: zig version

      - name: Install dependencies
        if: matrix.deps
        run: ${{ matrix.deps }}

      - name: Set OPENSSL_DIR
        if: matrix.windows
        shell: pwsh
        run: echo "OPENSSL_DIR=C:\OpenSSL-Win64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Android NDK
        if: matrix.ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Build
        run: zig build ${{ matrix.build }} --release=fast

      - name: List artifacts
        run: ls -lh zig-out/

      - name: Run tests
        if: matrix.test
        run: zig build ${{ matrix.test }} --release=fast

name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [ '**' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: 0.15.2

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (aarch64)
            runner: macos-15
            build: shared-lib
            test: true

          - name: macOS (x86_64)
            runner: macos-15-intel
            build: shared-lib
            test: true

          - name: Linux (x86_64)
            runner: ubuntu-latest
            build: shared-lib
            test: true

          - name: Linux (arm64)
            runner: ubuntu-24.04-arm
            build: shared-lib
            test: true

          - name: Windows (x64)
            runner: windows-latest
            build: shared-lib
            test: true
            windows: true
            os_arch: x64

          - name: Windows (arm64)
            runner: windows-11-arm
            build: shared-lib
            test: true
            windows: true
            os_arch: arm64

          - name: iOS (arm64)
            runner: macos-15
            build: static-lib -Dtarget=aarch64-ios

          - name: Android (arm64-v8a)
            runner: ubuntu-latest
            build: static-lib -Dtarget=aarch64-linux-android
            ndk: true

          - name: Android (armeabi-v7a)
            runner: ubuntu-latest
            build: static-lib -Dtarget=arm-linux-androideabi
            ndk: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: true

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux' && !matrix.ndk
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Cache vcpkg packages (Windows)
        if: matrix.windows
        uses: actions/cache@v6
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-openssl-${{ runner.os }}-${{ matrix.os_arch }}-v3
          restore-keys: |
            vcpkg-openssl-${{ runner.os }}-${{ matrix.os_arch }}-

      - name: Install OpenSSL (Windows via vcpkg — choco only ships x64)
        if: matrix.windows
        shell: pwsh
        run: |
          $osArch = "${{ matrix.os_arch }}"
          $triplet = "$($osArch)-windows"
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          $vcpkgExe = Join-Path $vcpkgRoot "vcpkg.exe"
          $opensslDir = Join-Path $vcpkgRoot "installed\$triplet"
          if (-not (Test-Path "$opensslDir\lib\libssl.lib")) {
            Write-Host "Cache miss; installing OpenSSL via vcpkg ($triplet)..."
            & $vcpkgExe install "openssl:$triplet" --triplet $triplet
            if ($LASTEXITCODE -ne 0) {
              Write-Error "vcpkg openssl:$triplet install failed"
              exit 1
            }
          } else {
            Write-Host "Using cached OpenSSL"
          }
          if (-not (Test-Path "$opensslDir\lib\libssl.lib")) {
            Write-Error "libssl.lib not found after vcpkg install"
            Get-ChildItem "$opensslDir" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 50
            exit 1
          }
          echo "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
          Write-Host "OpenSSL ready at $opensslDir"

      - name: Setup Android NDK
        if: matrix.ndk
        run: |
          NDK_VERSION="27.0.11902837"
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -d "$NDK_DIR" ]; then
            echo "NDK $NDK_VERSION not found, installing..."
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;$NDK_VERSION"
          else
            echo "NDK $NDK_VERSION already installed"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV

      - name: Show toolchain versions
        run: zig version

      - name: Build (${{ matrix.build }})
        run: zig build ${{ matrix.build }} --release=fast --summary all

      - name: List build outputs
        shell: bash
        run: ls -lhR zig-out/

      - name: Run tests
        if: matrix.test
        run: zig build test --release=fast --summary all
